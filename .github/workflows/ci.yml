name: Quality checks
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'evidence/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'evidence/**'
      - 'README.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            evidence/round2/e2e-results.json
            evidence/round2/accessibility/*.json
          retention-days: 14
